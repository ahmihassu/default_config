<!-- <div class="print-wrapper"> -->
  <link rel="stylesheet" href="/bahmni_config/openmrs/apps/registration/registrationCardLayout/css/print.css"/> 
    <div class="print-wrapper">
        <div style=" text-align: center;color: black; margin-bottom: 10px;">
          <h1 style="font-size: 14pt;margin-bottom: 0;color: black;font-family: Arial, sans-serif;" >
            <span style="font-family:nyala">Tirunesh Bejining Hospital</span>
        </h1>
        </div>
        
        <h4 style="text-align: center;">ED Triage Form</h4>
         <link rel="stylesheet" href="../styles/registrationPrint.css" media="all"/>
         <p>Patient Name 
          <span class="tick-text"> {{patient.fullNameLocal()}}</span>
          MRN <span  class="tick-text"> {{patient.primaryIdentifier.identifier}}</span>
     </p>
     <p>Age 
          <span class="tick-text"> {{patient.age | age}}</span>
          Sex <span  class="tick-text"> {{patient.gender}} </span>
     </p>
          <section class="block observation dashboard-section">
              <div style="width: 50%; height: 80vh; float: left; margin-right: 10%;">
              <div bahmni-observation patient="patient" config="{conceptNames: ['ED Triage, Time of arrival to ED', 'ED Triage, Triage time', 'ER Mode of arrival to the Hospital/ED', 'ED Triage, Origin of referral', 'ED Triage, Pre hospital care/First Aid given',
              'ED Triage, Chief complaint', 'ED Triage, Gravida' , 'ED Triage, Para', 'ED Triage, Abortion', 'ED Triage, LNMP' ,'ED Triage, Ultrasound Date' ,'ED Triage, Gestationa Age(GA)','ED Triage, Gestation',
              'ED Triage, If other specify',  'ED Triage, Vaginal Bleeding', 'ED Triage If yes', 'ED Triage, Seizure', 'ED Triage PV', 'ED Triage, Cervix', 'ED Triage, Membrane', 'ED Triage, Hours', 'ED Triage, Presentation', 'ED Triage, FHB'], scope: 'latest'}"
                        ertraigeprint="true" displaystyle="'normal view'" ></div>
              </div>
              <div style="width: 40%; height: 80vh; float: right;">
              <div bahmni-observation patient="patient" config="{conceptNames: ['ED Triage, BP', 'ED Triage, Past medical Illness', 'ED Triage, Assessment', 'ED Triage, Investigation Plan', 'ED Triage, Plan', 'ED Triage, Reevaluate after (hours)',
               'ED Triage, Triage Officer name'], scope: 'latest'}"
                        ertraigeprint="true" displaystyle="'table view'"  ></div>   
              </div>
              <div style="text-align: right;position:fixed;bottom: 40px;right: 40px;"><strong>{{currentUser.person.personName.givenName +" " + currentUser.person.personName.familyName+ " "}}   ___________</strong></div>                   
               
    
          </section>
        
    </div>
