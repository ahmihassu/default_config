<!-- <div class="print-wrapper"> -->
    <div class="print-wrapper">
        <div style=" text-align: center;color: black; margin-bottom: 10px;">
          <h1 style="font-size: 14pt;margin-bottom: 0;color: black;font-family: Arial, sans-serif;" >
            <span style="font-family:nyala">Tirunesh Bejining Hospital</span>
        </h1>
        </div>
        
        <h4 style="text-align: center;">Emergency Triage Form</h4>
         <link rel="stylesheet" href="../styles/registrationPrint.css" media="all"/>
        <h4>Patient MRN <span style="text-decoration: underline;"> {{patient.primaryIdentifier.identifier}}</span></h4>
          <section class="block observation dashboard-section">
              
              <div style="width: 50%; height: 80vh; float: left; margin-right: 10%;">
              <div bahmni-observation patient="patient" config="{conceptNames: ['Trige Date and time of Arrival', 'Triage Time of Arrival in Ethiopian Time (include whether it is day or night)', 'Trige Date and Time of Triage',
                        'Triage Time of Triage in Ethiopian Time (include whether it is day or night)', 'Triage Trauma (set)','Triage Time of Arrival', 'Triage Is the patient ambulatory', 'Triage Condition of the Patient',
                        'Trige Mode of arrival','Triage1 Other',  'Trige Was the patient referred','Trigeif yes','Trige if other specify',
                        'Triage Was pre-hospital care/First aid given','Triage if yes, specify','Triage Chief Complaint', 'Triage if other, specify',
                        'Triage Duration of illness', 'Triage Date of Onset', 'Triage Mechanism of Injury (Write if self inflicted)', 
                        'Triage Past Medical Illnessess', 'Triage Allergies','Medication Given','Intervention Done'], scope: 'latest'}"
                        ertraigeprint="true" displaystyle="'normal view'" ></div>
              </div>
              <div style="width: 40%; height: 80vh; float: right;">
              <div bahmni-observation patient="patient" config="{conceptNames: [  'SPO2 Data',  'Triage Random Blood Suger','Systolic Data','Diastolic Data', 'RR Data' , 'Temperature Data',  'Pulse Data',
                       'Triage Mobility', 'Triage AVPU', 'Triage Trauma', 'Triage Red','If Triage Red Other', 'Triage Orange', 'If Triage Orange Other', 'Triage Yellow', 'Triage Black', 'Triage Score Result','Triage Color Result'], scope: 'latest'}"
                        ertraigeprint="true" displaystyle="'table view'"  ></div>   
              </div>
              <div style="text-align: right;position:fixed;bottom: 40px;right: 40px;"><strong>{{currentUser.person.personName.givenName +" " + currentUser.person.personName.familyName+ " "}}   ___________</strong></div>                   
               
    
          </section>
        
    </div>
